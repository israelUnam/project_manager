<th:block th:fragment="_headers">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/css/style.css" rel="stylesheet">
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Initialize Bootstrap Components -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            function initializeDropdowns() {
                var dropdownElements = document.querySelectorAll('[data-bs-toggle="dropdown"]');
                dropdownElements.forEach(function(element) {
                    if (!bootstrap.Dropdown.getInstance(element)) {
                        new bootstrap.Dropdown(element);
                        console.log('Dropdown inicializado:', element);
                    }
                    element.addEventListener('click', function(e) {
                        setTimeout(() => {
                            console.log('Dropdown clic:', element, 'aria-expanded:', element.getAttribute('aria-expanded'), 'clases:', element.className);
                            var menu = element.parentElement.querySelector('.dropdown-menu');
                            if (menu) {
                                console.log('Dropdown menu clases:', menu.className, 'display:', getComputedStyle(menu).display);
                            }
                        }, 200);
                    });
                });
            }
            initializeDropdowns();
            var observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                    if (mutation.addedNodes.length || mutation.type === 'attributes') {
                        initializeDropdowns();
                    }
                });
            });
            observer.observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true,
                attributeFilter: ['class']
            });
            var modals = document.querySelectorAll('.modal');
            modals.forEach(function(modal) {
                modal.addEventListener('shown.bs.modal', function() {
                    initializeDropdowns();
                });
            });
        });
    </script>
</th:block>
