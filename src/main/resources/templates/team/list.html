<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Equipos - Project Manager</title>
    <headers th:replace="~{components/headers.html :: ~{_headers}}" />
    <!-- Custom CSS -->
    <link href="/css/style.css" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .team-card {
            height: 100%;
            transition: transform 0.2s;
        }
        .team-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .team-members-table {
            font-size: 1rem;
        }
        .team-members-table th, .team-members-table td {
            padding: 0.75rem;
            vertical-align: middle;
        }
        .card-header {
            background-color: #f8f9fa;
        }
        .empty-state {
            padding: 2rem;
            text-align: center;
            background-color: #f8f9fa;
            border-radius: 0.5rem;
            margin: 2rem 0;
        }
    </style>
</head>
<body>
<th:block th:fragment="content">
    <!-- Sidebar Backdrop -->
    <div class="sidebar-backdrop"></div>

    <sliderbar th:replace="~{components/sliderbar.html :: ~{_sliderbar}}" />
    <navbar th:replace="~{components/navbar.html :: ~{_navbar}}" />

    <!-- Main Content -->
    <div id="main-content" class="main-content">
        <div class="container-fluid">
            <div class="row mb-4">
                <div class="col">
                    <h2 class="mb-0">Equipos</h2>
                </div>
                <div class="col text-end">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#teamModal" 
                            th:disabled="${availableProjects == null or availableProjects.isEmpty()}" 
                            title="Debe existir al menos un proyecto sin equipo para crear uno nuevo">
                        <i class="fas fa-plus"></i> Nuevo Equipo
                    </button>
                </div>
            </div>

            <!-- Teams Grid -->
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" th:if="${teams != null and !teams.isEmpty()}">
                <div class="col" th:each="team : ${teams}">
                    <div class="card team-card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="card-title mb-0">
                                <i class="fas fa-users me-2"></i>
                                Proyecto: <span th:text="${team.project.nombre}">Nombre del Proyecto</span>
                            </h5>
                            <button class="btn btn-sm btn-outline-success" data-bs-toggle="modal" 
                                    th:data-bs-target="'#memberModal' + ${team.id}"
                                    title="Agregar Integrante">
                                <i class="fas fa-user-plus"></i>
                            </button>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-sm table-hover team-members-table">
                                    <thead>
                                        <tr>
                                            <th style="width: 45%">Nombre</th>
                                            <th style="width: 35%; text-align: center;">Rol</th>
                                            <th style="width: 20%; text-align: right;">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:if="${membersByTeam != null and membersByTeam.get(team.id) != null}" 
                                            th:each="member : ${membersByTeam.get(team.id)}">
                                            <td>
                                                <div th:text="${member.nombre}">Nombre</div>
                                                <small class="text-muted" th:text="${member.email}">Email</small>
                                            </td>
                                            <td style="text-align: center;" th:text="${member.rol}">Rol</td>
                                            <td style="text-align: right;">
                                                <div class="btn-group btn-group-sm">
                                                    <button class="btn btn-outline-secondary btn-sm" title="Editar" 
                                                            th:onclick="'showEditMemberModal(' + ${member.id} + ')'">
                                                        <i class="fas fa-edit"></i>
                                                    </button>
                                                    <button class="btn btn-outline-danger btn-sm" title="Eliminar"
                                                            th:onclick="'deleteMember(' + ${member.id} + ')'">
                                                        <i class="fas fa-trash"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                        <tr th:if="${membersByTeam == null or membersByTeam.get(team.id) == null or membersByTeam.get(team.id).isEmpty()}">
                                            <td colspan="3" class="text-center">No hay integrantes en este equipo</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${teams == null or teams.isEmpty()}" class="empty-state">
                <i class="fas fa-users fa-3x mb-3 text-muted"></i>
                <h4>No hay equipos disponibles</h4>
                <p class="text-muted">Primero debe crear un proyecto para poder agregar un equipo.</p>
            </div>

            <!-- Modal para Crear Equipo -->
            <div class="modal fade" id="teamModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Nuevo Equipo</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <form th:action="@{/teams}" method="post">
                            <div class="modal-body">
                                <div class="mb-3">
                                    <label for="project" class="form-label">Proyecto</label>
                                    <select class="form-select" id="project" name="project.id" required>
                                        <option value="">Seleccionar Proyecto</option>
                                        <option th:each="project : ${availableProjects}"
                                                th:value="${project.id}"
                                                th:text="${project.nombre}">
                                        </option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="descripcion" class="form-label">Descripción</label>
                                    <textarea class="form-control" id="descripcion" name="descripcion" rows="3"></textarea>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-primary">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Modal para Agregar Integrante -->
            <div th:each="team : ${teams}" th:id="'memberModal' + ${team.id}" class="modal fade" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Nuevo Integrante</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <form th:action="@{/teams/{teamId}/members(teamId=${team.id})}" method="post">
                            <div class="modal-body">
                                <div class="mb-3">
                                    <label for="nombre" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="nombre" name="nombre" required>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" name="email" required>
                                </div>
                                <div class="mb-3">
                                    <label for="rol" class="form-label">Rol</label>
                                    <input type="text" class="form-control" id="rol" name="rol" required>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-primary">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Modal para Editar Integrante -->
            <div class="modal fade" id="editMemberModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Editar Integrante</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <form id="editMemberForm" method="post">
                            <div class="modal-body">
                                <div class="mb-3">
                                    <label for="editNombre" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="editNombre" name="nombre" required>
                                </div>
                                <div class="mb-3">
                                    <label for="editEmail" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="editEmail" name="email" required>
                                </div>
                                <div class="mb-3">
                                    <label for="editRol" class="form-label">Rol</label>
                                    <input type="text" class="form-control" id="editRol" name="rol" required>
                                </div>
                                <input type="hidden" id="editTeamId" name="team.id">
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <script>
                let editMemberModal;

                document.addEventListener('DOMContentLoaded', function() {
                    editMemberModal = new bootstrap.Modal(document.getElementById('editMemberModal'));
                });

                async function showEditMemberModal(id) {
                    try {
                        const response = await fetch(`/teams/members/${id}`);
                        if (!response.ok) {
                            throw new Error('Error al cargar los datos del integrante');
                        }
                        const member = await response.json();

                        document.getElementById('editNombre').value = member.nombre;
                        document.getElementById('editEmail').value = member.email;
                        document.getElementById('editRol').value = member.rol;
                        document.getElementById('editTeamId').value = member.team.id;

                        const form = document.getElementById('editMemberForm');
                        form.action = `/teams/members/${id}/update`;

                        editMemberModal.show();
                    } catch (error) {
                        console.error('Error:', error);
                        alert('Error al cargar los datos del integrante');
                    }
                }

                async function deleteMember(id) {
                    try {
                        // Primero verificamos si el miembro tiene tareas asignadas
                        const checkResponse = await fetch(`/teams/members/${id}/check-tasks`);
                        const checkResult = await checkResponse.json();

                        if (checkResult.hasTasks) {
                            // Si tiene tareas, mostramos mensaje de error
                            Swal.fire({
                                icon: 'error',
                                title: 'No se puede eliminar',
                                text: 'No se puede eliminar el miembro del equipo porque tiene tareas asignadas',
                                confirmButtonText: 'Entendido'
                            });
                        } else {
                            // Si no tiene tareas, pedimos confirmación
                            Swal.fire({
                                title: '¿Está seguro?',
                                text: "¿Desea eliminar este miembro del equipo? Esta acción no se puede deshacer.",
                                icon: 'warning',
                                showCancelButton: true,
                                confirmButtonColor: '#d33',
                                cancelButtonColor: '#3085d6',
                                confirmButtonText: 'Sí, eliminar',
                                cancelButtonText: 'Cancelar'
                            }).then((result) => {
                                if (result.isConfirmed) {
                                    const form = document.createElement('form');
                                    form.method = 'POST';
                                    form.action = `/teams/members/${id}/delete`;
                                    document.body.appendChild(form);
                                    form.submit();
                                }
                            });
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        Swal.fire({
                            icon: 'error',
                            title: 'Error',
                            text: 'Hubo un problema al procesar la solicitud'
                        });
                    }
                }
            </script>
        </div>
    </div>
</th:block>
</body>
</html>
